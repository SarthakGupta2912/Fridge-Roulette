name: fridge_roulette
description: "Snap your fridge, spin the wheel, and cook a fun recipe with what you have."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The official Ultralytics plugin runs the bundled YOLO model on the phone.
  # The app never downloads a model, so it works fully offline.
  ultralytics_yolo: 0.5.1

  # Used only to open the system camera or gallery. It needs no network.
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # A small COCO-trained nano YOLO model (about 3 MB), bundled in the app.
    - assets/models/food_detector.tflite
