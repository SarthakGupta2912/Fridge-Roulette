name: fridge_roulette
description: "Snap your fridge, spin the wheel, and cook a fun recipe with what you have."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The official Ultralytics plugin runs the bundled YOLO model on the phone.
  ultralytics_yolo: 0.6.16

  # Used only to open the system camera or gallery. It needs no network.
  image_picker: ^1.2.4

  # The on-device recipe writer. The model is downloaded once, then reused
  # offline. The MediaPipe engine keeps Android 7 (minSdk 24) support.
  flutter_edge_ai: ^2.4.1
  flutter_edge_ai_mediapipe: ^1.2.2
  google_mlkit_text_recognition: 0.17.1
  # Used only to ask for the download-notification permission before the
  # one-time chef-brain download starts. It is already included by flutter_edge_ai.
  background_downloader: ^9.5.9
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Two small YOLO models are bundled so the app never downloads a detector:
    # - COCO nano detector (about 3 MB) for common foods like bananas and apples.
    # - FoodSeg103 nano segmenter (about 14 MB) for milk, eggs, bread, meat,
    #   vegetables and many more foods.
    - assets/models/food_detector.tflite
    - assets/models/food_detector_foodseg.tflite
